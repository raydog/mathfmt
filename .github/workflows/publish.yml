name: Tagged Release

# Process for starting a build is to push a new v... tag:
on:
  push:
   tags:
     - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # << OIDC (npm)
      contents: write # << Releases (github)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run build -- --release
      - run: npm run ops:get-changelog "${{ github.ref_name }}" "./build/release-desc.txt"
      - run: cat "./build/release-desc.txt"

      # Create the release directly in Github:
      - name: Create new Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: "./build/release-desc.txt"
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            ./build/MathFmt-browser.*
            ./build/MathFmt.*.d.ts

      # Publish the Node.js assets in NPM:
      # - run: npm publish --provenance --access public --tag beta
      #   working-directory: ./build/npm
      #   env:
      #     NODE_AUTH_TOKEN: ""
