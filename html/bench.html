<!doctype html>
<html>
  <head>
    <script
      src="https://code.jquery.com/jquery-4.0.0.slim.min.js"
      integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc="
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script>
      MathJax = {
        loader: {
          load: ["input/asciimath", "output/chtml"],
        },
      };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/mathjax@4/startup.js"
      defer
    ></script>
    <script src="/js/dev.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/asciimath/asciimathml@master/ASCIIMathML.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="row"><h1>Benchmarks</h1></div>
      <div class="row">
        <div id="results"></div>
      </div>
    </div>
    <script type="module">
      import { Bench } from "https://cdn.jsdelivr.net/npm/tinybench@6.0.2/dist/index.js";

      const FORMULAS = [
        "x = (-b +- sqrt(b^2 - 4ac)) / (2a)",
        "sum_(n=0)^oo 1/2^n = lim_(x->oo)(2^x-1)/2^(x-1) = 2",
        "DeltaE = (M - E_n + e*sin E_n)/(1 - e*cos E_n)",
        "sum_(k=1)^n k^3=1^3 + 2^3 + ... + n^3 = [(n(n+1))/2]^2",
        "Phi(x) = 1/(sqrt(2pi rho))e^{(x-mu)^2/(2rho^2)}",
        "f(omega) = int_oo^inftyf(x)e^{-2pi i x omega}dx",
        "1/2sigma^2S^2(del^2V)/(delS^2)+rS(delV)/(delS)+(delV)/(delt)-rV = 0",
        "root3(-q/2+sqrt(q^2/4+p^3/27))+root3(-q/2-sqrt(q^2/4+p^3/27))",
        "abs(sum_{k=1}^n u_k barv_k)^2 <= (sum_{k=1}^n abs(u_k))^2(sum_{k=1}^n abs(barv_k))^2",
        "|(1,x_1,x_1^2,cdots,x_1^{n-1}),(1,x_2,x_2^2,cdots,x_2^{n-1}),(1,x_3,x_3^2,cdots,x_3^{n-1}),(vdots,vdots,vdots, ddots,vdots),(1, x_n, x_n^2, cdots, x_n^{n-1})| = prod_{1<=i,j<=n}(x_i-x_j)",
      ];

      async function shortPause() {
        await new Promise((resolve) => setTimeout(resolve, 10));
      }

      async function runBenches() {
        const $results = $("#results");
        $results.empty().text("<< Running... >>");

        // Yield so the browser can do its thang:
        await shortPause();

        const bench = new Bench({
          name: "Render Time",
          warmup: true,
          warmupTime: 50,
          time: 250,
        });
        bench.add("MathFmt", () => {
          for (const formula of FORMULAS) {
            const html = MathFmt.intoMathML(formula);
          }
        });
        bench.add("ASCIIMathML", () => {
          for (const formula of FORMULAS) {
            const html = asciimath.parseMath(formula).innerHTML;
          }
        });
        bench.add("MathJax 4", () => {
          for (const formula of FORMULAS) {
            const html = MathJax.asciimath2mml(formula);
          }
        });
        await MathJax.startup.promise;
        const tasks = await bench.run();
        console.table(bench.table());
        renderTable($results, tasks);
      }

      async function profileMathFmt() {
        $("#profile-btn").attr("disabled", true);
        await shortPause();
        for (let i = 0; i < 10000; i++) {
          for (const formula of FORMULAS) {
            const html = MathFmt.intoMathML(formula);
          }
        }
        $("#profile-btn").attr("disabled", false);
      }

      function renderTable($results, tasks) {
        const t = $("<table></table>").addClass(
          "table table-sm table-bordered table-striped table-hover",
        );
        const head = $("<thead></thead>");
        const body = $("<tbody></tbody>");
        const tr = $("<tr></tr>");
        t.append(head, body);
        head.append(tr);
        tr.append($("<th>Name</th>"));
        tr.append($("<th>Samples</th>"));
        tr.append($("<th>Min (ms)</th>"));
        tr.append($("<th>Mean (ms)</th>"));
        tr.append($("<th>P99 (ms)</th>"));
        tr.append($("<th>Max (ms)</th>"));
        tr.append($("<th>Throughput (Runs/sec)</th>").attr("colspan", "2"));

        const maxThroughput = Math.max(
          ...tasks.map((t) => t.result.throughput?.mean ?? 0),
        );

        for (const task of tasks) {
          const row = $("<tr></tr>");
          row.append($("<td></td>").text(task.name));
          row.append(
            $("<td></td>").text(task.result.latency?.samplesCount ?? "--"),
          );
          row.append(
            $("<td></td>").text(task.result.latency?.min?.toFixed(3) ?? "--"),
          );
          row.append(
            $("<td></td>").text(task.result.latency?.mean?.toFixed(3) ?? "--"),
          );
          row.append(
            $("<td></td>").text(task.result.latency?.p99?.toFixed(3) ?? "--"),
          );
          row.append(
            $("<td></td>").text(task.result.latency?.max?.toFixed(3) ?? "--"),
          );
          row.append(
            $("<td></td>").text(
              task.result.throughput?.mean?.toFixed(3) ?? "--",
            ),
          );

          const percent =
            ((task.result.throughput?.mean ?? 0) / maxThroughput) * 100;

          const progress = $("<div></div>")
            .addClass("progress")
            .css("min-width", "8em")
            .css("border-radius", "0")
            .attr("role", "progressbar")
            .attr("aria-valuenow", percent.toFixed(1))
            .attr("aria-valuemin", "0")
            .attr("aria-valuemax", "100");

          progress.append(
            $("<div></div>")
              .addClass("progress-bar")
              .css("width", percent.toFixed(3) + "%"),
          );

          row.append(
            $("<td></td>").css("vertical-align", "middle").append(progress),
          );

          body.append(row);
        }
        $results
          .empty()
          .append(
            t,
            $("<button></button")
              .text("Re-run Benchmarks")
              .addClass("btn btn-primary")
              .attr("onclick", "runBenches()"),
            $("<button></button")
              .attr("id", "profile-btn")
              .text("Profile MathFmt")
              .addClass("btn btn-primary")
              .attr("onclick", "profileMathFmt()"),
          );
      }

      globalThis.runBenches = runBenches;
      globalThis.profileMathFmt = profileMathFmt;
      $(runBenches);
    </script>
  </body>
</html>
